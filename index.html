<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function getComputerChoice()
        {
            let randomNum = Math.random();
            if (randomNum < 1/3){
                console.log("computer: rock")
                return "rock";
            }
            if (randomNum < 2/3){    
                console.log("computer: paper")
                return "paper";
            }
            console.log("computer: scissors")
            return "scissors";
        }


        function playGame()
        {
            let humanScore = 0;
            let computerScore = 0;

            // Create three buttons
            const rockBtn = document.createElement("button");
            rockBtn.textContent = "Rock";
            document.body.appendChild(rockBtn);

            const paperBtn = document.createElement("button");
            paperBtn.textContent = "Paper";
            document.body.appendChild(paperBtn);

            const scissorsBtn = document.createElement("button");
            scissorsBtn.textContent = "Scissors";
            document.body.appendChild(scissorsBtn);

            // Create display area to display scores and round result
            const display = document.createElement("div");
            document.body.appendChild(display);

            const roundResult = document.createElement("p");
            display.appendChild(roundResult);

            const showScore = document.createElement("p");
            showScore.textContent = `Human score is ${humanScore}, computer score is ${computerScore}.`;
            display.appendChild(showScore);

            const showWinner = document.createElement("p");
            showWinner.style.fontWeight = "bold";
            display.appendChild(showWinner);


            function playRound(humanChoice, computerChoice)
            {
                console.log("human choice is " + humanChoice);
                if (humanChoice === "rock" && computerChoice === "scissors"
                    || humanChoice === "scissors" && computerChoice === "paper" 
                    || humanChoice === "paper" && computerChoice == "rock"
                )
                {
                    humanScore++;
                    roundResult.textContent = `Computer: ${computerChoice}. Congratulations you won!`
                    showScore.textContent = `Human score is ${humanScore}, computer score is ${computerScore}.`;
                    if (humanScore === 5){
                        showWinner.textContent = "Human player won the game.";
                        humanScore = computerScore = 0;
                    }
                }
                else if (humanChoice === computerChoice)
                {
                    roundResult.textContent = `Computer: ${computerChoice}. A tie.`;
                }
                else{
                    computerScore++;
                    roundResult.textContent = `Computer: ${computerChoice}. You lose!`;
                    showScore.textContent = `Human score is ${humanScore}, computer score is ${computerScore}.`;
                    if (computerScore === 5){
                        showWinner.textContent = "Computer player won the game.";
                        humanScore = computerScore = 0;
                    }
                }
            }

            
            rockBtn.addEventListener("click", () =>{
                playRound("rock", getComputerChoice());
            });
            paperBtn.addEventListener("click", () => {
                playRound("paper", getComputerChoice());
            })
            scissorsBtn.addEventListener("click", () => {
                playRound("scissors", getComputerChoice());
            })
            
        }

        playGame();
        
    </script>
</body>
</html>
